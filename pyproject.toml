[project]
name = "llmcomm"
version = "0.1.0"
description = "Local LLM / TTS / STT option evaluation testbed for natural Korean conversation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "kss>=6.0",
    "nvidia-ml-py>=12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LLM backends
ollama = ["ollama>=0.4"]
llamacpp = ["llama-cpp-python>=0.3"]
# TTS engines (install only the ones under test)
supertonic = ["supertonic>=1.3", "huggingface_hub>=0.30"]
melotts = ["melotts"]  # source pinned to git below; PyPI sdist is broken
edge = ["edge-tts>=6.1"]
# STT
whisper = ["faster-whisper>=1.0"]
# quality scoring
judge = ["jiwer>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
llmcomm = "llmcomm.cli:app"

[tool.uv.sources]
melotts = { git = "https://github.com/myshell-ai/MeloTTS.git" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.uv]
# torch must be the CUDA build for RTX 50xx (sm_120); default PyPI wheels are CPU-only on Windows
index = [{ name = "pytorch-cu128", url = "https://download.pytorch.org/whl/cu128", explicit = true }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcomm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
