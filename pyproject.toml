[project]
name = "llmcomm"
version = "0.1.0"
description = "Local LLM / TTS / STT option evaluation testbed for natural Korean conversation"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "numpy>=1.26",
    "soundfile>=0.12",
    "sounddevice>=0.5",
    "kss>=6.0",
    "nvidia-ml-py>=12.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# LLM backends
ollama = ["ollama>=0.4"]
llamacpp = ["llama-cpp-python>=0.3"]
# TTS engines (install only the ones under test)
supertonic = ["onnxruntime-gpu>=1.18"]
# melotts: PyPI package is broken; install with
#   uv pip install git+https://github.com/myshell-ai/MeloTTS.git && uv run python -m unidic download
edge = ["edge-tts>=6.1"]
# STT
whisper = ["faster-whisper>=1.0"]
# quality scoring
judge = ["jiwer>=3.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
llmcomm = "llmcomm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmcomm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
