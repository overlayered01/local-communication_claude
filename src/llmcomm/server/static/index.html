<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmcomm option tester</title>
<style>
  :root { --fg:#1b1b1b; --muted:#6b7280; --line:#d9dde3; --bg:#fff; --card:#f7f8fa;
          --wait:#9ca3af; --run:#2563eb; --play:#16a34a; --done:#4b5563; --err:#dc2626; }
  * { box-sizing: border-box; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--fg); background: var(--bg);
         max-width: 960px; margin: 1.5rem auto; padding: 0 16px; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.5; }
  h2 { margin: 0 0 .75rem; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin-bottom: .5rem; }
  select, input, button { font: inherit; font-size: 1rem; padding: .35rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { cursor: pointer; } button:disabled { opacity: .5; cursor: default; }
  #msg { flex: 1; min-width: 200px; }
  .badge { display: inline-block; padding: .1rem .5rem; border-radius: 999px; font-size: .8rem; color: #fff; background: var(--wait); }
  .badge.loading, .badge.unloading { background: var(--run); } .badge.ready { background: var(--play); } .badge.error { background: var(--err); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .75rem; margin-bottom: .75rem; }
  .card h3 { margin: 0 0 .5rem; font-size: .95rem; color: var(--muted); font-weight: 600; }
  /* pipeline stepper */
  .steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
  .step { border-top: 4px solid var(--wait); padding-top: .35rem; font-size: .85rem; }
  .step .n { color: var(--muted); font-size: .75rem; } .step .t { font-variant-numeric: tabular-nums; font-weight: 600; }
  .step.active { border-color: var(--run); } .step.active .t { color: var(--run); }
  .step.done { border-color: var(--play); }
  #elapsed { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85rem; margin-left: auto; }
  /* log */
  #log { max-height: 320px; overflow-y: auto; padding: .25rem; }
  .turn { margin: .35rem 0; } .turn .who { color: var(--muted); font-size: .8rem; margin-right: .4rem; }
  .turn.bot .text::after { content: "▍"; color: var(--run); } .turn.bot.final .text::after { content: ""; }
  /* sentence table */
  table { width: 100%; border-collapse: collapse; font-size: .875rem; }
  th, td { text-align: left; padding: .3rem .4rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; } td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .st { display: inline-block; padding: 0 .45rem; border-radius: 999px; color: #fff; font-size: .75rem; white-space: nowrap; }
  .st.synth { background: var(--run); } .st.queued { background: var(--wait); } .st.playing { background: var(--play); } .st.done { background: var(--done); }
  #metrics { font-size: .875rem; } #metrics td.num { text-align: right; }
  #error { color: var(--err); white-space: pre-wrap; display: none; margin-top: .5rem; }
  @media (max-width: 640px) { .steps { grid-template-columns: repeat(3, 1fr); } }
</style>
<body>
<h2>llmcomm option tester</h2>

<div class="row">
  LLM <select id="llm"></select> <span class="badge" id="llm-state">미로드</span>
  TTS <select id="tts"></select> <span class="badge" id="tts-state">미로드</span>
  <button id="warm" title="선택한 옵션을 미리 로드하고 warmup합니다">미리 로드</button>
</div>
<div class="row">
  <input id="msg" placeholder="메시지 입력 후 Enter">
  <button id="send">전송</button>
  <button id="stop" disabled>재생 중단</button>
  <button id="reset">대화 초기화</button>
</div>

<div class="card">
  <div class="row" style="margin-bottom:.35rem"><h3 style="margin:0">진행 단계</h3><span id="elapsed"></span></div>
  <div class="steps" id="steps">
    <div class="step" data-k="sent"><div class="n">생성 시작</div><div class="t">-</div></div>
    <div class="step" data-k="ttft"><div class="n">첫 토큰</div><div class="t">-</div></div>
    <div class="step" data-k="sentence"><div class="n">첫 문장</div><div class="t">-</div></div>
    <div class="step" data-k="audio"><div class="n">첫 음성</div><div class="t">-</div></div>
    <div class="step" data-k="llm_done"><div class="n">LLM 완료</div><div class="t">-</div></div>
    <div class="step" data-k="play_done"><div class="n">재생 완료</div><div class="t">-</div></div>
  </div>
  <div id="error"></div>
  <div id="hint" style="display:none;color:var(--run);margin-top:.5rem">브라우저가 오디오 재생을 막고 있습니다. 페이지 아무 곳이나 클릭하면 재생이 시작됩니다.</div>
</div>

<div class="card"><h3>대화</h3><div id="log"></div></div>

<div class="card"><h3>문장별 파이프라인 (클라이언트 기준 경과 시각, ms)</h3>
  <table><thead><tr><th>#</th><th>문장</th><th>상태</th><th>문장 감지</th><th>음성 도착</th><th>재생 시작</th><th>길이</th></tr></thead>
  <tbody id="sent"></tbody></table>
</div>

<div class="card"><h3>서버 지표 (ms)</h3><table id="metrics"><tbody></tbody></table></div>

<script>
const $ = s => document.querySelector(s);
const SYSTEM = "당신은 친근한 한국어 대화 상대입니다. 짧고 자연스럽게 답하세요.";
let ws, history = [{ role: "system", content: SYSTEM }];
let ctx, playAt = 0, sources = [], turn = null, t0 = 0, timer = null, meta = null;
let rows = [], lastAudioEnd = 0, llmDone = false, ttftMarked = false, started = false;

fetch("/options").then(r => r.json()).then(o => {
  for (const k of ["llm", "tts"]) $("#" + k).innerHTML = o[k].map(x => `<option>${x}</option>`).join("");
  const prefer = { llm: "ollama_qwen3_8b", tts: "supertonic_gpu" };
  for (const k in prefer) if (o[k].includes(prefer[k])) $("#" + k).value = prefer[k];
  return fetch("/loaded").then(r => r.json());
}).then(l => { for (const k in l) if ($("#" + k).value === l[k]) setState(k, "ready"); });

function now() { return Math.round(performance.now() - t0); }
function setState(kind, stage, detail) {
  const b = $("#" + kind + "-state");
  b.className = "badge " + stage;
  const label = { loading: "로드 중…", ready: "준비됨", unloading: "해제 중…", error: "오류", wait: "미로드" }[stage] || stage;
  b.textContent = detail ? `${label} ${detail}` : label;
}
function step(k, ms, active) {
  const el = document.querySelector(`.step[data-k="${k}"]`);
  el.querySelector(".t").textContent = ms == null ? "-" : ms + " ms";
  document.querySelectorAll(".step.active").forEach(e => e.classList.replace("active", "done"));
  el.classList.add(active ? "active" : "done");
}
function resetSteps() {
  document.querySelectorAll(".step").forEach(e => { e.className = "step"; e.querySelector(".t").textContent = "-"; });
  $("#sent").innerHTML = ""; rows = []; $("#error").style.display = "none";
  lastAudioEnd = 0; llmDone = false; ttftMarked = false;
}
function row(i) {
  while (rows.length <= i) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="num">${rows.length + 1}</td><td></td><td><span class="st queued">대기</span></td>` +
                   `<td class="num">-</td><td class="num">-</td><td class="num">-</td><td class="num">-</td>`;
    $("#sent").appendChild(tr); rows.push({ tr, start: null, end: null });
  }
  return rows[i];
}
function setRow(i, cls, label) { const s = row(i).tr.children[2].firstChild; s.className = "st " + cls; s.textContent = label; }
function fmt(v) { return typeof v === "number" ? Math.round(v) : String(v); }
function finish() { $("#stop").disabled = true; clearInterval(timer); timer = null; }

function tick() {
  $("#elapsed").textContent = started ? "경과 " + now() + " ms" : "옵션 로드 중… " + now() + " ms";
  $("#hint").style.display = (ctx && ctx.state === "suspended" && rows.some(r => r.start != null)) ? "block" : "none";
  if (ctx) for (let i = 0; i < rows.length; i++) {
    const r = rows[i]; if (r.start == null) continue;
    if (ctx.currentTime >= r.end) setRow(i, "done", "완료");
    else if (ctx.currentTime >= r.start) setRow(i, "playing", "재생 중");
  }
  if (llmDone && ctx && rows.length && rows.every(r => r.start != null) && ctx.currentTime >= lastAudioEnd) {
    step("play_done", now(), false); finish();
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws/chat`);
  ws.binaryType = "arraybuffer";
  ws.onclose = () => { $("#send").disabled = false; };
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      const m = JSON.parse(e.data);
      if (m.type === "start") {
        t0 = performance.now(); started = true; step("sent", 0, true);
      } else if (m.type === "status") {
        setState(m.kind, m.stage, m.stage === "ready" ? (m.ms ? `(${m.ms} ms)` : "") : m.option);
      } else if (m.type === "text") {
        if (!ttftMarked) { ttftMarked = true; step("ttft", now(), true); }
        turn.querySelector(".text").textContent += m.delta; $("#log").scrollTop = $("#log").scrollHeight;
      } else if (m.type === "sentence") {
        if (m.index === 0) step("sentence", now(), true);
        const r = row(m.index); r.tr.children[1].textContent = m.text; r.tr.children[3].textContent = now();
        setRow(m.index, "synth", "합성 중");
      } else if (m.type === "audio_meta") {
        meta = m;
      } else if (m.type === "metrics") {
        if (m.warmup_only) { $("#send").disabled = false; return; }
        step("llm_done", fmt(m.llm_done_ms), rows.length > 0); llmDone = true;
        $("#metrics tbody").innerHTML = Object.entries(m).filter(([k]) => k !== "type")
          .map(([k, v]) => `<tr><td>${k}</td><td class="num">${fmt(v)}</td></tr>`).join("");
        turn.classList.add("final"); history.push({ role: "assistant", content: turn.querySelector(".text").textContent });
        $("#send").disabled = false;
        if (!rows.length) { step("play_done", now(), false); finish(); }
      } else if (m.type === "error") {
        $("#error").textContent = m.message; $("#error").style.display = "block";
        $("#send").disabled = false; finish(); if (turn) turn.classList.add("final");
      }
      return;
    }
    // binary PCM16 frame belonging to the last audio_meta
    const i16 = new Int16Array(e.data);
    const f32 = Float32Array.from(i16, x => x / 32768);
    const buf = ctx.createBuffer(1, f32.length, meta.sample_rate);
    buf.copyToChannel(f32, 0);
    const src = ctx.createBufferSource(); src.buffer = buf; src.connect(ctx.destination);
    const start = Math.max(ctx.currentTime, playAt);
    src.start(start); playAt = start + buf.duration; sources.push(src);
    const r = row(meta.index); r.start = start; r.end = playAt; lastAudioEnd = playAt;
    r.tr.children[4].textContent = now();
    r.tr.children[5].textContent = Math.round(now() + (start - ctx.currentTime) * 1000);
    r.tr.children[6].textContent = meta.seconds.toFixed(1) + " s";
    setRow(meta.index, "queued", "재생 대기");
    if (meta.index === 0) step("audio", now(), true);
    $("#stop").disabled = false;
  };
}

function send(payload) {
  if (!ws || ws.readyState > 1) connect();
  const go = () => ws.send(JSON.stringify(payload));
  ws.readyState === 1 ? go() : (ws.onopen = go);
}

$("#send").onclick = () => {
  const c = $("#msg").value.trim(); if (!c) return;
  if (!ctx) ctx = new AudioContext(); if (ctx.state === "suspended") ctx.resume();
  resetSteps(); t0 = performance.now(); started = false;
  history.push({ role: "user", content: c });
  const log = $("#log");
  log.insertAdjacentHTML("beforeend", `<div class="turn you"><span class="who">나</span><span class="text"></span></div>`);
  log.lastElementChild.querySelector(".text").textContent = c;
  log.insertAdjacentHTML("beforeend", `<div class="turn bot"><span class="who"></span><span class="text"></span></div>`);
  turn = log.lastElementChild; turn.querySelector(".who").textContent = `${$("#llm").value} + ${$("#tts").value}`;
  log.scrollTop = log.scrollHeight;
  $("#msg").value = ""; $("#send").disabled = true;
  if (timer) clearInterval(timer); timer = setInterval(tick, 100);
  send({ llm: $("#llm").value, tts: $("#tts").value, messages: history });
};
$("#msg").onkeydown = e => { if (e.key === "Enter") $("#send").click(); };
$("#warm").onclick = () => { $("#send").disabled = true; send({ llm: $("#llm").value, tts: $("#tts").value, messages: [], warmup_only: true }); };
$("#stop").onclick = () => {
  sources.forEach(s => { try { s.stop(); } catch (_) {} }); sources = []; playAt = 0;
  rows.forEach((r, i) => { if (r.start != null && ctx.currentTime < r.end) { setRow(i, "done", "중단"); r.end = ctx.currentTime; } });
  lastAudioEnd = ctx ? ctx.currentTime : 0; $("#stop").disabled = true;
};
$("#reset").onclick = () => {
  history = [{ role: "system", content: SYSTEM }]; $("#log").innerHTML = ""; resetSteps();
  $("#metrics tbody").innerHTML = ""; $("#elapsed").textContent = "";
};
for (const k of ["llm", "tts"]) $("#" + k).onchange = () => setState(k, "wait");
document.addEventListener("click", () => { if (ctx && ctx.state === "suspended") ctx.resume(); });
</script>
</body>
</html>
